name: Feature request
description: Something Relay Chat Dock should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does the app fall short?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you want it to do instead?
    validations:
      required: true
